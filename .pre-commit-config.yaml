# Проверка секретов до попадания в коммит: тот же конфиг, что и в CI.
# Ставится один раз: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  # Публичные данные — тот же гейт, что и job `public-data` в CI: секреты
  # ловит gitleaks, а приватные идентификаторы (адреса, домашние каталоги,
  # чужие проектные файлы) — этот скрипт.
  - repo: local
    hooks:
      - id: public-data
        name: Публичные данные (DATA_POLICY.md в simintech-code)
        entry: python3 scripts/public_data_check.py
        language: system
        pass_filenames: false
