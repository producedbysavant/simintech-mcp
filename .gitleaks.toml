# Секреты в этом репозитории: ключи, токены, пароли.
#
# Проверяется **вся история**: секрет, попавший в коммит, остаётся в
# репозитории навсегда, и находить его надо там, где он живёт, а не только в
# текущем дереве. Правила — поставляемые gitleaks; своих здесь нет намеренно,
# идентификаторы организации живут в `.gitleaks-corporate.toml`, у которого
# свой проход.
#
# Запуск: gitleaks git --log-opts="--all" --config .gitleaks.toml .
title = "simintech: секреты во всей истории"

[extend]
useDefault = true
