[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simintech-mcp"
version = "0.2.0"
description = "MCP-сервер для управления SimInTech через COM API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EVS360" }]
dependencies = [
    # Библиотека-ядро. Для локальной разработки заменить на path-зависимость:
    # simintech-api = { path = "../simintech-code", editable = true }
    #
    # ВНИМАНИЕ: тег v0.2.0 не содержит `Project.from_template`,
    # `set_calc_end_time` и класса «В файл» — на нём `create_project` падает с
    # AttributeError, а собрать считающуюся модель нельзя. До выпуска
    # следующего тега ставьте библиотеку из локального checkout (path-строка
    # выше) или напрямую из main.
    "simintech-api @ git+https://github.com/producedbysavant/simintech-code@v0.2.0",
    "mcp>=1.0.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    # Маркер @pytest.mark.anyio регистрирует плагин, встроенный в anyio.
    "anyio>=4.0",
]

[project.scripts]
simintech-mcp = "simintech_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["simintech_mcp"]

[tool.hatch.metadata]
# Зависимость объявлена прямой git-ссылкой (см. выше). Hatchling по умолчанию
# такие ссылки запрещает: без этого флага сборка падает с
# "Dependency #1 ... cannot be a direct reference".
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
