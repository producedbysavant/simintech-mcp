[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simintech-mcp"
version = "0.2.0"
description = "MCP-сервер для управления SimInTech через COM API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EVS360" }]
dependencies = [
    # Библиотека-ядро. Для локальной разработки заменить на path-зависимость:
    # simintech-api = { path = "../simintech-code", editable = true }
    #
    # Пин на КОММИТ, а не на тег v0.2.0: в теге нет `standard_block_size`,
    # `default_output_dir`, `Project.from_template`, `set_calc_end_time` и
    # класса «В файл». Сервер импортирует первые два, поэтому на теге падал
    # уже на импорте (`ImportError`), а `create_project` — с AttributeError:
    # собрать считающуюся модель было нельзя вообще. Как только в
    # simintech-code появится тег новее — заменить SHA на него.
    "simintech-api @ git+https://github.com/producedbysavant/simintech-code@f810bc9f930bfe5684f8a492f78310dcbae028ac",
    "mcp>=1.0.0",
    "fastmcp>=2.0",
    # Импортируется напрямую — проверка корректности .xprt в
    # `inspect_project_file`. Приходит и транзитивно с simintech-api, но своя
    # зависимость честнее: обычный xml.etree на чужом файле открывает XXE.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    # Маркер @pytest.mark.anyio регистрирует плагин, встроенный в anyio.
    "anyio>=4.0",
]

[project.scripts]
simintech-mcp = "simintech_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["simintech_mcp"]

[tool.hatch.metadata]
# Зависимость объявлена прямой git-ссылкой (см. выше). Hatchling по умолчанию
# такие ссылки запрещает: без этого флага сборка падает с
# "Dependency #1 ... cannot be a direct reference".
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
