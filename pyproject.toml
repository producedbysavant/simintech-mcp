[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simintech-mcp"
# Версия берётся из `simintech_mcp/__init__.py`: пока она была прописана в двух
# местах, они разошлись (в `__init__.py` осталось 0.1.0 против 0.2.0 здесь), и
# `simintech_mcp.__version__` врал. Та же правка сделана в `simintech-code`.
dynamic = ["version"]
description = "MCP-сервер для управления SimInTech через COM API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "producedbysavant" }]
dependencies = [
    # Библиотека-ядро. Для локальной разработки заменить на path-зависимость:
    # simintech-api = { path = "../simintech-code", editable = true }
    #
    # Ревизия — релизный тег (политика владельца, 2026-10-01): теги `v*`
    # защищены ruleset'ом `protect-release-tags` в репозитории библиотеки
    # (удаление и перезапись запрещены, bypass-акторов нет). Якорь `# sha:`
    # ниже фиксирует коммит выпуска: `check_pins.py` (CI-шаг до установки)
    # сверяет с ним разрешение тега, проверяет, что версия в этом коммите
    # (`simintech_api/__init__.py`) совпадает с именем тега, и называет любое
    # расхождение человеческим текстом, а не даёт pip упасть невнятно.
    #
    # Прежняя политика (до 2026-10-01) — пин на КОММИТ: `refs/tags` можно
    # передвинуть, и та же строка зависимости начнёт разрешаться в другой код
    # молча. Это не теория: тег v0.2.0 стоял на коде 0.1.0, где нет ни
    # `standard_block_size`, ни `default_output_dir`, ни `Project.from_template`
    # — сервер падал на нём уже на импорте. Теперь этот случай ловит проверка
    # содержимого в `check_pins.py`, а не только неизменяемость ревизии.
    #
    # История пинов: менялся дважды за 2026-09-26, и оба раза SHA исчезал из
    # origin (историю пересоздавали и переписывали; установка падала с
    # `upload-pack: not our ref`) — тот класс отказа и породил CI-гейт. Прежние
    # ревизии: `b77f6594…` — 0.7.0 (`main` до контура), `eb6a754…` — временный
    # на вершине ветки PR #16, `30d0ab1…` — `main` до правки #19, `215c3b1…` —
    # `main` до выпуска 0.10.1, `ab8ad854…` — v0.10.1.
    # v0.11.0 — релизный тег simintech-code (библиотека 0.11.0): ownership
    # COM-сессии и managed shutdown (squash-коммит PR #29 `069d3a7`):
    # `SessionOwnership`/`session_pid`/`ownership` выводятся снимками
    # mmain.exe до и после `CreateObject`, `shutdown()` — release, ожидание
    # exact PID и точечное завершение только своей сессии; запущенный вручную
    # (GUI) экземпляр распознаётся как EXTERNAL. На этом контракте стоит гейт
    # владения сервера (`session._require_owned`).
    # v0.12.0 — релизный тег simintech-code (библиотека 0.12.0): job-объект
    # (`KILL_ON_JOB_CLOSE`) над процессом OWNED-сессии — смерть процесса-
    # клиента снимает mmain силами ядра (`job_handle`/`job_error`), плюс
    # перепроверка снимка процессов (ложный UNKNOWN при классификации
    # владения исключён); squash-коммиты PR #31 `0436b88` и PR #33 `6fc7e63`.
    # v0.13.0 — релизный тег simintech-code (библиотека 0.13.0): реестр функций
    # встроенного языка со схемой 2 (`syntax` и `args` в записях, squash PR
    # #37 `6921642`), предпроверка `Project.open` на несуществующем пути
    # (PR #38 `637976a`), фикс моста — запертый файл результата (PR #35
    # `5d0b3d7`, он тоже после v0.12.0), доки/клеймы (PR #36 `778b645`);
    # выпускной коммит `b88d005`.
    # v0.13.1 — релизный тег simintech-code (библиотека 0.13.1):
    # `parse_xprt_block_script` — чтение скрипта блока «Язык программирования»
    # из выгрузки `.xprt` (обе конвенции кавычек, первая страница, отказ на
    # повреждённом снимке и неполном остатке; squash-коммит PR #41 `addbd0f`);
    # выпускной коммит `003f6b0`.
    # c31cc96 — коммит main simintech-code после мержа PR #53 (squash):
    # канон укладки ТЗ 4 — channel_width/cut_sizes/round_step/ALIGN_EPS в
    # simintech_api.layout.canon, шаг колонок от канала разреза (полуширины
    # соседей, round_step — снап больше не подрезает канал), вертикальный
    # зазор по пинам, канал обратных связей, нормализация слоёв (_back_edges
    # — внутриколоночных связей нет) и повторяющаяся ячейка (layout/repeat):
    # collapse/place/детектор. Плюс снятие запрета «Из памяти» (PR #49) и
    # native-path записи (PR #51), вошедшие в main ранее. Пин v0.13.2 этих
    # модулей не содержит — mcp-инструменты (layout_place: canon/repeat)
    # падали на импорте в CI, пока пин не поднят.
    # sha: c31cc96b2702285fd4d878ace1ee36a94dc60ca8
    # v0.14.0 — релизный тег simintech-code (библиотека 0.14.0): `shutdown`
    # сообщает исход снятия — True/False по проверке живости `is_process_alive`
    # вместо снимка процессов (dfae919; выпускная заметка d3de5fd; PR #54,
    # issue #34; squash-коммит main ff87db1, тег указывает на него). Сервер
    # `disconnect` называет процесс «завершённым» по этому исходу и больше не
    # сканирует снимки.
    # sha: ff87db189b2e5569eeb0a704ebeab1bd0ae2fbb6
    # v0.15.0 - релизный тег simintech-code (библиотека 0.15.0): запуск
    # макроса через `mstarter` (#56) и слот скриптовой записи на каждую
    # страницу: страница без собственного script больше не ломает
    # `export_model_text` и `run_page_script` (issue #69, PR #70; squash-коммит
    # main 2303eca, тег указывает на него). Нумерация записей не сдвигается,
    # скрипт свойства за страничный не берётся.
    # sha: 2303ecade74b594f1d3611e408d0010b6879b76c
    # v0.16.0: Model IR C1-C3 (см. историю пинов выше).
    # v0.17.0: релизный тег simintech-code (библиотека 0.17.0): реестр
    # контрактов блоков на 958 классов. Свойства и умолчания из каталога,
    # портовые модели fixed/nport/portnames/submodel/unknown, неизмеренное
    # остаётся unknown с причиной; ports_for синтезирует входы по nport.
    # squash-коммит main 1f6354f, тег указывает на него.
    # sha: 1f6354f96addcdf2e37685ea43cb489211b673bc
    # v0.18.0: релизный тег simintech-code (библиотека 0.18.0): SystemSpec
    # и верификация. compile_system_spec собирает все ошибки за проход,
    # verify_model сверяет контейнеры, объекты, классы, порты, провода и
    # инварианты, вердикт не выдаёт partial за passed. squash-коммит main
    # 992f3bb, тег указывает на него.
    # sha: 992f3bbdbda8945712a737d1606c994934975017
    # v0.18.1: P5: контекст и полнота. Ответы запросов ограничены 200
    # элементами с truncated и полными items_total/unknown_total,
    # find_cycles не считает внутреннее ребро блока петлёй, Omitted
    # паспорта резервирует место, VerificationReport несёт truncated при
    # полных counts. squash-коммит main 52c335b, тег указывает на него.
    # sha: 52c335bd7518d97b36264cbed2ba80c80600482d
    # v0.18.2: концы проводов SystemSpec нумеруются внутри направления,
    # как у connect; verify_model переводит сквозной port.index IR в этот
    # номер. squash-коммит main f4171c3, тег указывает на него.
    # sha: f4171c3d3b4552a6757e9f643d540f81a6240a63
    # v0.18.3: живая приёмка P5/C4. Секция Contracts паспорта берёт реестр
    # C4 вместо заглушки; trace_signal both объединяет проходы без дублей;
    # query называет недостающий аргумент через ModelQueryError.
    # squash-коммит main 47e8482, тег указывает на него.
    # sha: 47e8482c7745483487d9a7589d5d11909f24a6e1
    # v0.18.4: сверка проводов считает направленные номера только по OUT/IN;
    # undirected порты двигателя (a-, a+, f-, f+) не сдвигают Tm и ω, как и
    # в connect. Живой электропривод больше не даёт ложный wire_missing.
    # squash-коммит main a134098, тег указывает на него.
    # sha: a1340985f1ec44bf47384b4e289af713ec31ad4b
    "simintech-api @ git+https://github.com/producedbysavant/simintech-code@v0.18.4",
    # MCP SDK v2: FastMCP 4 работает на нём. Прямая нижняя граница важна:
    # на 1.x поля аннотаций camelCase, на 2.x snake_case, и сервер не должен
    # молча ставиться со старым SDK.
    "mcp>=2.3.0",
    "fastmcp>=4.1.1",
    # Pydantic используется напрямую для ModelSpec и проверки входа.
    "pydantic>=2.14.1",
    # Импортируется напрямую — проверка корректности .xprt в
    # `inspect_project_file`. Приходит и транзитивно с simintech-api, но своя
    # зависимость честнее: обычный xml.etree на чужом файле открывает XXE.
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    # Маркер @pytest.mark.anyio регистрирует плагин, встроенный в anyio.
    # Нижняя граница 4.12 — из-за параметризации по ДОСТУПНЫМ бэкендам
    # (`get_available_backends`, versionadded 4.12): на 4.5–4.11 параметры
    # безусловны (`get_all_backends`), и с установленным trio серия тоже
    # идёт — проверено по исходникам wheels, — но 4.12 снимает вопрос для
    # окружений без trio (там старые версии создают лишние параметры).
    "anyio>=4.15",
    # Второй бэкенд anyio: плагин гоняет каждый anyio-тест по доступным
    # бэкендам — с установленным trio серия [trio] идёт вдобавок к [asyncio].
    # Второй проход работает детектором утечек состояния между тестами:
    # именно им вскрылась связь через класс моста в `test_block_script_tools`
    # (находка #83, падал только [trio]). Без trio этой серии нет — половина
    # матрицы не гоняется.
    "trio>=0.34",
]

[project.scripts]
simintech-mcp = "simintech_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["simintech_mcp"]

[tool.hatch.version]
path = "simintech_mcp/__init__.py"

[tool.hatch.metadata]
# Зависимость объявлена прямой git-ссылкой (см. выше). Hatchling по умолчанию
# такие ссылки запрещает: без этого флага сборка падает с
# "Dependency #1 ... cannot be a direct reference".
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["simintech_mcp"]
# Проверять и тела функций без аннотаций. Иначе проверка затронула бы только
# подписанные функции — то есть почти ничего: инструменты как раз и были без
# аннотаций возврата.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Сторонние библиотеки без заглушек — перечислены поимённо, а не общим
# `ignore_missing_imports`. Общий флаг молча выключал проверку и для
# simintech-api: в нём не было маркера PEP 561 (`simintech_api/py.typed`),
# поэтому mypy считал библиотеку нетипизированной, каждый вызов её API
# получал тип `Any`, и гейт был слеп к опечатке в имени метода и к смене
# сигнатуры — ровно к тому классу ошибок, к которому относится
# `set_silent_mode`. Маркер добавлен в библиотеку; `fastmcp`/`mcp` приходят с
# `py.typed` сами, без заглушек остаётся `defusedxml`.
module = ["defusedxml", "defusedxml.*", "simintech_api", "simintech_api.*"]
# `simintech-api` здесь держится до тех пор, пока пин в `dependencies` не
# переедет на коммит/тег с маркером: CI ставит зависимость по гиту и гоняет
# `mypy` без `PYTHONPATH`, а установленная копия без `py.typed` дала бы
# `import-untyped`. Флаг НЕ делает библиотеку `Any`: `ignore_missing_imports`
# глушит только сообщение об отсутствующих заглушках, а найденный пакет с
# маркером проверяется как обычно — это проверено внедрённой опечаткой в
# вызове `Project.get_main_page()` (ошибка `attr-defined` на месте).
ignore_missing_imports = true
