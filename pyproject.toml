[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simintech-api"
version = "0.1.0"
description = "Python-библиотека для программного управления SimInTech через внешний COM API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EVS360" }]
dependencies = [
    "comtypes>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
simintech-cli = "simintech_api.cli:main"

[tool.setuptools]
packages = [
    "simintech_api",
    "simintech_api.core",
    "simintech_api.layout",
    "simintech_api.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: тесты, требующие реального COM-сервера SimInTech на Windows (deselect через -m 'not integration')",
]
