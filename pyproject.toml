[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simintech-mcp"
# Версия берётся из `simintech_mcp/__init__.py`: пока она была прописана в двух
# местах, они разошлись (в `__init__.py` осталось 0.1.0 против 0.2.0 здесь), и
# `simintech_mcp.__version__` врал. Та же правка сделана в `simintech-code`.
dynamic = ["version"]
description = "MCP-сервер для управления SimInTech через COM API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EVS360" }]
dependencies = [
    # Библиотека-ядро. Для локальной разработки заменить на path-зависимость:
    # simintech-api = { path = "../simintech-code", editable = true }
    #
    # Пин на КОММИТ, а не на тег v0.2.0: в теге нет `standard_block_size`,
    # `default_output_dir`, `Project.from_template`, `set_calc_end_time` и
    # класса «В файл». Сервер импортирует первые два, поэтому на теге падал
    # уже на импорте (`ImportError`), а `create_project` — с AttributeError:
    # собрать считающуюся модель было нельзя вообще. Как только в
    # simintech-code появится тег новее — заменить SHA на него.
    "simintech-api @ git+https://github.com/producedbysavant/simintech-code@3b6900d4cbad8e976951ab99e307be3a1eba98a8",
    "mcp>=1.0.0",
    "fastmcp>=2.0",
    # Импортируется напрямую — проверка корректности .xprt в
    # `inspect_project_file`. Приходит и транзитивно с simintech-api, но своя
    # зависимость честнее: обычный xml.etree на чужом файле открывает XXE.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    # Маркер @pytest.mark.anyio регистрирует плагин, встроенный в anyio.
    "anyio>=4.0",
]

[project.scripts]
simintech-mcp = "simintech_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["simintech_mcp"]

[tool.hatch.version]
path = "simintech_mcp/__init__.py"

[tool.hatch.metadata]
# Зависимость объявлена прямой git-ссылкой (см. выше). Hatchling по умолчанию
# такие ссылки запрещает: без этого флага сборка падает с
# "Dependency #1 ... cannot be a direct reference".
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["simintech_mcp"]
# simintech-api и fastmcp поставляются без заглушек: без этого mypy считал бы
# ошибкой каждый их импорт, и настоящие находки утонули бы в шуме.
ignore_missing_imports = true
# Проверять и тела функций без аннотаций. Иначе проверка затронула бы только
# подписанные функции — то есть почти ничего: инструменты как раз и были без
# аннотаций возврата.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
