name: simintech-model-building
version: 0.1.0
description: Построение и правка модели SimInTech через MCP-инструменты.
requires:
  mcp_tools:
    - create_project
    - add_block
    - connect
    - list_blocks
    - get_block_params
    - set_block_param
    - layout_place
  data:
    - simintech_api/data/block_catalog.json
source_of_truth:
  - simintech_api/data/block_catalog.json
  - scripts/generate_block_catalog.py
  - sitECRT/doc/reference/com_api_inventory.md
verified: true
verified_note: >
  Имена параметров сгенерированы из реального SimInTech (SimInTech64,
  2026-09-10) и проверены записью с последующим чтением .xprt. Имена из
  examples/ оказались частично неверными (y0 у «Константы», xn у «Сумматора»)
  и были исправлены.
